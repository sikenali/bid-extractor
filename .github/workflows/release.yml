name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (rebuild native modules for Electron)
        run: npm ci

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build & Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --x64 --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release/*
          if-no-files-found: warn

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish Draft Release
        run: |
          DRAFT_RELEASE=$(gh release list --repo ${{ github.repository }} --json tagName,isDraft --jq '.[] | select(.tagName == "${{ steps.version.outputs.VERSION }}" and .isDraft == true) | .tagName' 2>/dev/null || true)
          if [ -n "$DRAFT_RELEASE" ]; then
            gh release edit "$DRAFT_RELEASE" --draft=false
            echo "✅ Release $DRAFT_RELEASE 已发布"
          else
            echo "⚠️ 未找到草稿 Release，手动检查: https://github.com/${{ github.repository }}/releases"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "## ✅ 三平台桌面版构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Windows**: 文取星-${VERSION}-windows-x64.exe" >> "$GITHUB_STEP_SUMMARY"
          echo "- **macOS Intel**: 文取星-${VERSION}-mac-x64.dmg" >> "$GITHUB_STEP_SUMMARY"
          echo "- **macOS Apple Silicon**: 文取星-${VERSION}-mac-arm64.dmg" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Linux**: 文取星-${VERSION}-linux-x64.AppImage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 [点击下载](https://github.com/${{ github.repository }}/releases/tag/${VERSION})" >> "$GITHUB_STEP_SUMMARY"